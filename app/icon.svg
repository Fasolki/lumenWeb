<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    LÜMEN mark: the L in the brand's gold-to-ember gradient on the warm
    near-black used across the site, with the same radial bloom motif.
    Drawn as a stroked path rather than text so it never depends on a font
    being available, and stays crisp at every size.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset="0.55" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF5E3A"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFC24B" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFC24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0A0908"/>
  <rect width="64" height="64" rx="15" fill="url(#bloom)"/>
  <path
    d="M22 16 V43 H45"
    fill="none"
    stroke="url(#g)"
    stroke-width="9.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
