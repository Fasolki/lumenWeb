<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://dj-lumen.com/" />

    <title>DJ LÜMEN — Afro-Tech, Jungle & Deep House DJ | Bookings</title>
    <meta
      name="description"
      content="DJ LÜMEN plays organic Afro-Tech, jungle rhythms and deep house at clubs, beach clubs and private events across Spain and beyond. Watch the Sunset Sessions and request a booking."
    />
    <meta name="author" content="DJ LÜMEN" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="DJ LÜMEN" />
    <meta property="og:url" content="https://dj-lumen.com/" />
    <meta property="og:title" content="DJ LÜMEN — Afro-Tech, Jungle & Deep House DJ" />
    <meta
      property="og:description"
      content="Organic Afro-Tech, jungle rhythms and deep house. Clubs, beach clubs and private events. Watch the Sunset Sessions and request a booking."
    />
    <meta property="og:image" content="https://dj-lumen.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DJ LÜMEN performing live" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DJ LÜMEN — Afro-Tech, Jungle & Deep House DJ" />
    <meta
      name="twitter:description"
      content="Organic Afro-Tech, jungle rhythms and deep house. Clubs, beach clubs and private events."
    />
    <meta name="twitter:image" content="https://dj-lumen.com/images/og-image.jpg" />

    <!-- Fonts: preconnect so the handshake overlaps HTML parsing -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tells Google this is a music artist, which is what earns the rich result -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "@id": "https://dj-lumen.com/#lumen",
        "name": "LÜMEN",
        "alternateName": "DJ LÜMEN",
        "url": "https://dj-lumen.com/",
        "image": "https://dj-lumen.com/images/og-image.jpg",
        "description": "DJ playing organic Afro-Tech, jungle rhythms and deep house at clubs, beach clubs and private events.",
        "genre": ["Afro House", "Afro-Tech", "Deep House", "Organic House", "Jungle House"],
        "email": "lifeonfullvolume@gmail.com",
        "sameAs": [
          "https://www.youtube.com/@LifeOnFullVolume",
          "https://www.instagram.com/lifeonfullvolume_"
        ]
      }
    </script>
  </head>
